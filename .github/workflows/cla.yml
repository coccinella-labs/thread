---
name: CLA

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'coccinella-labs'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            signed.json

      - name: Checkout cla-bot
        uses: actions/checkout@v7
        with:
          repository: coccinella-labs/clabot
          token: ${{ secrets.CLA_BOT_TOKEN }}
          path: cla-bot

      - name: Copy signed.json to cla-signers.json
        run: |
          cp signed.json cla-signers.json

      - name: Run CLA bot
        uses: ./cla-bot/
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
